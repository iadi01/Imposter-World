<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="100%" height="100%">
  <!-- Top Secret Manila Classroom Case Folder -->
  <defs>
    <filter id="hand-drawn-folder" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" />
    </filter>
  </defs>

  <g filter="url(#hand-drawn-folder)">
    <!-- Back Folder Flap -->
    <path d="M35 55 L95 55 L108 42 L185 42 C190 42 194 46 194 51 L194 155 C194 160 190 164 185 164 L35 164 C30 164 26 160 26 155 L26 64 C26 59 30 55 35 55 Z" fill="#D97706" stroke="#234A91" stroke-width="4" stroke-linejoin="round" />

    <!-- Confidential Document Poking Out -->
    <rect x="50" y="30" width="115" height="110" rx="3" fill="#FFFFFF" stroke="#234A91" stroke-width="3" transform="rotate(-4 105 85)" />
    <!-- Document Text Lines -->
    <g transform="rotate(-4 105 85)" opacity="0.6">
      <line x1="62" y1="45" x2="140" y2="45" stroke="#C64132" stroke-width="3" stroke-linecap="round" />
      <line x1="62" y1="58" x2="150" y2="58" stroke="#234A91" stroke-width="2.5" stroke-dasharray="4 3" />
      <line x1="62" y1="70" x2="135" y2="70" stroke="#234A91" stroke-width="2.5" stroke-dasharray="4 3" />
      <line x1="62" y1="82" x2="145" y2="82" stroke="#234A91" stroke-width="2.5" stroke-dasharray="4 3" />
    </g>

    <!-- Front Folder Cover -->
    <path d="M30 65 L190 65 C195 65 198 69 198 74 L198 162 C198 167 194 170 189 170 L30 170 C25 170 21 166 21 161 L21 74 C21 69 25 65 30 65 Z" fill="#F59E0B" stroke="#234A91" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Classroom Masking Tape Sticker on Corner -->
    <rect x="25" y="52" width="45" height="18" fill="#FDE047" fill-opacity="0.85" stroke="#CA8A04" stroke-width="1.5" transform="rotate(-25 45 60)" />

    <!-- RED "TOP SECRET" STAMP -->
    <g transform="translate(70, 95) rotate(-10)">
      <rect x="0" y="0" width="105" height="42" rx="4" fill="none" stroke="#DC2626" stroke-width="4" stroke-dasharray="80 3" />
      <text x="52" y="27" fill="#DC2626" font-family="'Caveat Brush', 'Arial Black', sans-serif" font-weight="900" font-size="19" text-anchor="middle" letter-spacing="2">TOP SECRET</text>
    </g>

    <!-- Cute Paperclip on Top Right -->
    <path d="M165 52 L165 25 C165 18 174 18 174 25 L174 58 C174 68 156 68 156 58 L156 30 C156 25 162 25 162 30 L162 50" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" />

    <!-- Classified Dossier Fingerprint Doodle -->
    <circle cx="50" cy="135" r="14" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
    <circle cx="50" cy="135" r="9" fill="none" stroke="#B45309" stroke-width="1.5" opacity="0.7" />
    <circle cx="50" cy="135" r="4" fill="#B45309" opacity="0.7" />
  </g>
</svg>