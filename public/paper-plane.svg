<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="100%" height="100%">
  <!-- Notebook Paper Airplane with Loop-de-loop Trail -->
  <defs>
    <filter id="hand-drawn-plane" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
  </defs>

  <g filter="url(#hand-drawn-plane)">
    <!-- Dashed Flight Trail with Loop -->
    <path d="M25 160 C50 165 70 145 70 120 C70 85 45 90 45 115 C45 145 100 135 130 95" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="5 5" stroke-linecap="round" />
    <!-- Loop Accent dots -->
    <circle cx="58" cy="110" r="2.5" fill="#C64132" />
    <circle cx="75" cy="140" r="2" fill="#F59E0B" />

    <!-- Origami Airplane Body (Hand-folded Notebook Look) -->
    <!-- Shadow / Under-wing -->
    <polygon points="120,95 190,40 135,115" fill="#CBD5E1" stroke="#234A91" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Center Keel / Fold -->
    <polygon points="135,115 190,40 155,100" fill="#93C5FD" stroke="#234A91" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Main Left Wing -->
    <polygon points="100,75 190,40 135,115" fill="#FFFFFF" stroke="#234A91" stroke-width="4" stroke-linejoin="round" />
    <!-- Top Right Wing Fold -->
    <polygon points="120,95 190,40 170,125 150,118" fill="#F8FAFC" stroke="#234A91" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Blue ruled notebook line on airplane wing! -->
    <line x1="120" y1="72" x2="160" y2="56" stroke="#93C5FD" stroke-width="2" />
    <line x1="128" y1="82" x2="155" y2="70" stroke="#93C5FD" stroke-width="2" />
    <!-- Red margin stripe on wing! -->
    <line x1="110" y1="75" x2="125" y2="105" stroke="#FCA5A5" stroke-width="2" />

    <!-- Doodle Wind Speed Lines -->
    <path d="M195 32 L210 26 M188 20 L198 16 M205 45 L215 48" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />

    <!-- Playful Star Sticker -->
    <path d="M165 72 L168 77 L174 78 L169 82 L171 88 L165 85 L160 88 L162 82 L157 78 L163 77 Z" fill="#F59E0B" stroke="#B45309" stroke-width="1.5" />
  </g>
</svg>